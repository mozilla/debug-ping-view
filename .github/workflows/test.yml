name: "Test"

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        run: npm install

      - name: Build webapp
        run: npm run build

  test-functions:
    runs-on: ubuntu-latest
    steps:
      - *checkout

      - name: Install dependencies
        run: cd functions && npm install

      - name: Test Cloud Functions in offline mode
        run: cd functions && npm test

  test-app:
    runs-on: ubuntu-latest
    steps:
      - *checkout

      - name: Install dependencies
        run: npm install

      - name: Run app tests
        run: npm test
